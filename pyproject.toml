[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-cli-tool"
version = "0.1.0"
description = "A simple and practical CLI tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "typer[all]>=0.12.0",
]

[project.scripts]
my-cli-tool = "my_cli_tool.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_cli_tool*"]
